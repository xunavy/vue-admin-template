<script>
export default {
  name: 'UserCardList',
  props: {
    userList: {
      type: Array,
      required: true,
      default: () => []
    }
  },
  methods: {
    handleCardClick(userId) {
      console.log('User ID:', userId)
    },
    handleAvatarError(event, username) {
      event.target.style.display = 'none'
      const placeholder = event.target.nextElementSibling
      if (placeholder) {
        placeholder.style.display = 'flex'
      }
    },
    getStatusType(status) {
      switch (status) {
        case 1:
          return 'success'
        case 0:
          return 'danger'
        case 2:
          return 'primary'
        default:
          return ''
      }
    },
    getStatusText(status) {
      switch (status) {
        case 1:
          return '正常'
        case 0:
          return '禁用'
        case 2:
          return '待审核'
        default:
          return ''
      }
    }
  }
}
</script>

